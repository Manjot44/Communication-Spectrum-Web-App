services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: myuser       
      POSTGRES_PASSWORD: mypassword 
      POSTGRES_DB: MyCommsPro           
    volumes:
      - ./init:/docker-entrypoint-initdb.d # Mount init directory
    ports:
      - "5432:5432"
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: 
      - "5005:5005"
    environment:
      - REDIS_HOST=redis
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: 
      - "3901:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5005
    depends_on:
     - app