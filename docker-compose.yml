version: '3.8'
services:
    redis:
        image: "redis:alpine"
        ports:
        - "6379:6379"
    app:
        build: ./backend
        ports:
        - "5005:5005"
        environment:
        - REDIS_HOST=redis

    frontend:
        build: ./frontend
        ports:
        - "3901:3000"
        environment:
        - REACT_APP_BACKEND_URL=http://localhost:5005
        depends_on:
        - app