services:
  db:
    build:
      context: .
      dockerfile: init/Dockerfile
    environment:
      POSTGRES_USER: myuser       
      POSTGRES_PASSWORD: mypassword 
      POSTGRES_DB: MyCommsPro           
    ports:
      - "5432:5432"
    volumes:
      - ./init/:/docker-entrypoint-initdb.d/init_files/
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
  app:
    build: ./backend
    ports: 
      - "5005:5005"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports: 
      - "3901:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5005
    depends_on:
     - app
